# Render Blueprint for the Neural Bridge FastAPI backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# The free plan sleeps after ~15 minutes of inactivity and cold-starts in ~50s,
# so the Next.js frontend auto-reconnects (see components/TelemetrySocket.tsx).
services:
  - type: web
    name: neural-bridge-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; the app must bind to it or it will fail health checks.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NEURAL_BRIDGE_MODE
        value: mock
      # Set to your Vercel production origin, e.g. https://neural-bridge.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, e.g. https://.*\.vercel\.app
      - key: CORS_ORIGIN_REGEX
        sync: false
      # Optional but recommended: shared secret required by POST /devices.
      # The bridge sends the same value as NB_DEVICE_REGISTRATION_KEY.
      - key: DEVICE_REGISTRATION_KEY
        sync: false
      # Server-side Gemini key. Leave blank to use the deterministic fallback.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # 0 disables "thinking" so short replies are complete and fast.
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "160"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "8"
      - key: INTENT_RATE_LIMIT_SECONDS
        value: "3"
      # Short per-client cooldown before a physical haptic pulse is queued.
      - key: HAPTIC_RATE_LIMIT_SECONDS
        value: "0.5"
