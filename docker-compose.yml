services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - NEURAL_BRIDGE_MODE=mock

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/telemetry
    ports:
      - "3000:3000"
    depends_on:
      - api
