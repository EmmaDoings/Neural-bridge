name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: ../.venv/bin/python -m pytest tests -q
        working-directory: backend
      - run: python -m venv hardware/.venv
      - run: hardware/.venv/bin/python -m pip install -r hardware/requirements-dev.txt
      - run: .venv/bin/python -m pytest tests -q
        working-directory: hardware
      - run: hardware/.venv/bin/python scripts/verify_pipeline.py
